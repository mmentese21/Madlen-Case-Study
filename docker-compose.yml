services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "6831:6831/udp"  # For traces (not needed for http exporter)
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OpenTelemetry HTTP endpoint
    environment:
      - COLLECTOR_OTLP_ENABLED=true